openapi: 3.0.3
info:
  title: FinPlan GPS API
  version: 1.0.0
  description: Hackathon financial planning API — WalkingTree 2026
servers:
  - url: http://localhost:3000
    description: Local development

paths:
  /health:
    get:
      summary: Service health
      tags: [System]
      responses:
        "200":
          description: Service is up

  /api/v1/service-info:
    get:
      summary: Application metadata and service map
      tags: [System]
      responses:
        "200":
          description: OK

  /api/v1/system/health:
    get:
      summary: Extended health (Postgres, Gemini, fallback)
      tags: [System]
      responses:
        "200":
          description: OK

  /api/v1/auth/login:
    post:
      summary: Authenticate demo planner or client
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid credentials
        "422":
          description: Validation failed

  /api/v1/goals:
    get:
      summary: List financial goals
      tags: [Goals]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    post:
      summary: Create a goal (planner)
      tags: [Goals]
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created

  /api/v1/goals/simulate:
    post:
      summary: SIP goal simulation
      tags: [Goals]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
        "422":
          description: Invalid simulation parameters

  /api/v1/ira/chat:
    post:
      summary: Ira multi-agent advisory chat
      tags: [Ira]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Advisory completed
        "422":
          description: Empty or invalid prompt
        "500":
          description: Orchestration or LLM failure

  /api/v1/ira/agent-traces/{executionId}:
    get:
      summary: Get agent execution trace by ID
      tags: [Ira]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: executionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Trace found
        "404":
          description: Trace not found

  /api/v1/ira/feedback:
    post:
      summary: Submit human feedback on Ira response
      tags: [Ira]
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Feedback recorded
        "422":
          description: Missing required feedback fields

  /api/v1/ira/learning/dashboard:
    get:
      summary: Agent learning dashboard metrics
      tags: [Learning]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { nullable: true }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        timestamp: { type: string, format: date-time }
